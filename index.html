<!DOCTYPE html>
<html lang="jp">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    body {
        overflow: hidden;
    }
    #block {
        width: 100px;
        height: 100px;
        background-color: brown;
    }

    canvas {
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
        pointer-events: none;
    }

    .n {
        width: 200px;
        height: 10px;
        background-color: rgb(0, 0, 0);
        position: absolute;
        top: 200px;
        transform-origin: center left;
    }

    .n1 {
        top: 400px;
    }
    .n2 {
        top: 600px;
    }
    .n3 {
        top: 800px;
    }

    .nav {
        position: fixed;
        top: 50%;
        right: 40px;
        transform: translateY(-50%);
        list-style: none;
        background-color: #fff;
        border-radius: 999px;
        padding: 20px 10px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .nav li {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: #e4e4e4;
    }


</style>
